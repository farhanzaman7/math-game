<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Game</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif;
      background: linear-gradient(160deg, #ffe066, #ff9f68);
      color: #3d2c8d;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 32px;
      padding: 32px 24px;
      box-shadow: 0 10px 0 #e0673a;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 2rem;
      color: #ff5d8f;
    }

    .levels {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .levels button {
      font-size: 1.25rem;
      padding: 8px 16px;
      background: #e9e4ff;
      color: #3d2c8d;
      box-shadow: 0 4px 0 #b8aef0;
    }

    .levels button:active {
      box-shadow: 0 1px 0 #b8aef0;
    }

    .levels button.selected {
      background: #7209b7;
      color: #ffffff;
      box-shadow: 0 4px 0 #4a0677;
    }

    .question {
      font-size: 4rem;
      font-weight: bold;
      margin: 16px 0 24px;
    }

    .answer-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    input {
      width: 160px;
      font-size: 3rem;
      text-align: center;
      padding: 8px;
      border: 5px solid #4cc9f0;
      border-radius: 20px;
      color: #3d2c8d;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: #7209b7;
    }

    button {
      font-size: 2rem;
      font-family: inherit;
      font-weight: bold;
      padding: 12px 32px;
      border: none;
      border-radius: 20px;
      background: #06d6a0;
      color: #ffffff;
      box-shadow: 0 6px 0 #049a73;
      cursor: pointer;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #049a73;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .message {
      min-height: 3rem;
      margin-top: 24px;
      font-size: 2rem;
      font-weight: bold;
    }

    .message.correct {
      color: #06a77d;
    }

    .message.wrong {
      color: #f3722c;
    }

    .score {
      margin-top: 24px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #3d2c8d;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Let's Add!</h1>

    <div class="levels" id="levels">
      <button data-max="5" aria-pressed="false">Easy</button>
      <button data-max="10" aria-pressed="true" class="selected">Medium</button>
      <button data-max="20" aria-pressed="false">Hard</button>
    </div>

    <div class="question" id="question"></div>

    <div class="answer-row">
      <input id="answer" type="number" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Your answer">
      <button id="check">Check</button>
    </div>

    <div class="message" id="message" aria-live="polite"></div>
  </div>

  <div class="score" id="score">Score: 0 / 0</div>

  <script>
    // Grab the parts of the page we need to read or change.
    const questionEl = document.getElementById("question");
    const answerEl = document.getElementById("answer");
    const checkButton = document.getElementById("check");
    const messageEl = document.getElementById("message");
    const scoreEl = document.getElementById("score");

    // The two numbers in the current question.
    let a = 0;
    let b = 0;

    // Score tracking.
    let correctCount = 0;
    let totalCount = 0;

    // Biggest number a question can use. Medium (10) is the starting level.
    let maxNumber = 10;

    // Remembers the 1-second wait after a correct answer, so it can be cancelled.
    let nextQuestionTimer = null;

    // Pick a whole number from 0 to maxNumber.
    function randomNumber() {
      return Math.floor(Math.random() * (maxNumber + 1));
    }

    function newQuestion() {
      a = randomNumber();
      b = randomNumber();
      questionEl.textContent = a + " + " + b + " = ?";
      answerEl.value = "";
      messageEl.textContent = "";
      messageEl.className = "message";
      answerEl.disabled = false;
      checkButton.disabled = false;
      answerEl.focus();
    }

    function updateScore() {
      scoreEl.textContent = "Score: " + correctCount + " / " + totalCount;
    }

    function checkAnswer() {
      // Ignore empty answers so they don't count against the score.
      if (answerEl.value.trim() === "") {
        messageEl.textContent = "Type a number first!";
        messageEl.className = "message wrong";
        answerEl.focus();
        return;
      }

      const guess = Number(answerEl.value);
      totalCount++;

      if (guess === a + b) {
        correctCount++;
        messageEl.textContent = "🎉 Great job!";
        messageEl.className = "message correct";
        // Lock the input so the same answer can't be counted twice.
        answerEl.disabled = true;
        checkButton.disabled = true;
        nextQuestionTimer = setTimeout(newQuestion, 1000);
      } else {
        messageEl.textContent = "Oops! Try again 💪";
        messageEl.className = "message wrong";
        answerEl.select();
      }

      updateScore();
    }

    // Difficulty picker: switch the number range and start a fresh question.
    const levelButtons = document.querySelectorAll("#levels button");

    levelButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        maxNumber = Number(button.dataset.max);

        levelButtons.forEach(function (other) {
          other.classList.remove("selected");
          other.setAttribute("aria-pressed", "false");
        });
        button.classList.add("selected");
        button.setAttribute("aria-pressed", "true");

        clearTimeout(nextQuestionTimer);
        newQuestion();
      });
    });

    checkButton.addEventListener("click", checkAnswer);

    answerEl.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        checkAnswer();
      }
    });

    newQuestion();
  </script>
</body>
</html>
